  var sortedAll=sortedByRating(songs);
  var rankMap={};
  sortedAll.forEach(function(s,i){ rankMap[s.id]=i+1; });
  libGenres=allGenres();
  if(libFilter!==null && libGenres.indexOf(libFilter)===-1) libFilter=null;
  var list=sortedAll;
  if(libFilter!==null) list=list.filter(function(s){ return s.genre===libFilter; });
  var q=searchQuery.trim().toLowerCase();
  if(q){
    list=list.filter(function(s){ return s.title.toLowerCase().indexOf(q)>-1 || s.artist.toLowerCase().indexOf(q)>-1; });
  }
  var chips=['<button class="pool-chip '+(libFilter===null?'on':'')+'" onclick="setLibFilterIdx(-1)">All <span class="n">'+songs.length+'</span></button>'];
  libGenres.forEach(function(g,gi){
    chips.push('<button class="pool-chip '+(libFilter===g?'on':'')+'" onclick="setLibFilterIdx('+gi+')">'+escapeHtml(g)+' <span class="n">'+genreCount(g)+'</span></button>');
  });
  lastShownIds = list.map(function(s){ return s.id; });
  var bar='';
  if(editMode){
    var n=selectedCount();
    var allOn = lastShownIds.length && lastShownIds.every(function(id){ return selectedIds[id]; });
    bar='<div class="action-bar">'+
      '<button class="btn ghost" onclick="selectAllShown()">'+(allOn?'Clear selection':'Select all '+list.length)+'</button>'+
      '<button class="btn danger" '+(n?'':'disabled style="opacity:.4"')+' onclick="deleteSelected()">Remove'+(n?' ('+n+')':'')+'</button>'+
    '</div>';
  }
  var poolTools='';
  if(editMode && libFilter!==null){
    poolTools='<div class="action-bar" style="padding-top:0;position:static;">'+
      '<button class="btn ghost" onclick="renamePool('+jsArg(libFilter)+')">Rename pool</button>'+
      '<button class="btn danger" onclick="deletePool('+jsArg(libFilter)+')">Delete pool</button></div>';
  }
  var shown = list.slice(0, libLimit);
  var rows=shown.map(function(s){ return rankRow(s, rankMap[s.id]); }).join('');
  var more = list.length>shown.length ? '<button class="btn ghost block" onclick="showMore()">Show more ('+(list.length-shown.length)+' left)</button>' : '';
  return warnHtml()+
    '<input class="search-box" id="searchInput" type="search" autocomplete="off" placeholder="Search title or artist" value="'+escapeHtml(searchQuery)+'" oninput="setSearch(this.value)">'+
    '<div class="pool-chips" style="margin-bottom:2px;">'+chips.join('')+'</div>'+
    '<div class="list-toolbar"><span class="count">'+list.length+' shown</span>'+
      '<button class="edit-toggle '+(editMode?'on':'')+'" onclick="toggleEdit()">'+(editMode?'Done':'Edit')+'</button></div>'+
    bar+poolTools+
    (editMode?'<div class="info-banner">Removing a song takes it out of its own pool only. Matches it played are folded into its opponents&rsquo; records, so their standing survives. Tap &#9998; to move a song to another pool.</div>':'')+
    (rows||'<p style="color:var(--cream-dim);font-size:13.5px;">No matches.</p>')+
    more+
    '<button class="btn ghost block" onclick="exportCSV()">Export rankings as CSV</button>';
}
function rankRow(s, rank){
  if(editMode){
    var on=!!selectedIds[s.id];
    return '<div class="rank-row '+(on?'sel':'')+'" onclick="toggleSelect('+jsArg(s.id)+')">'+
      '<div class="checkbox '+(on?'on':'')+'">'+(on?'&#10003;':'')+'</div>'+
      '<div class="rank-info"><div class="rank-title">'+escapeHtml(s.title)+'</div>'+
      '<div class="rank-artist">'+escapeHtml(s.artist)+' &middot; '+escapeHtml(s.genre)+'</div></div>'+
      '<button class="icon-btn" title="Move to another pool" aria-label="Move to another pool" onclick="event.stopPropagation(); changeGenre('+jsArg(s.id)+')">&#9998;</button></div>';
  }
  var set = !isOpen(s);
  var swing = Math.round(s.places||0);
  var firm = set || swing <= Math.max(1, 0.015*songs.length);
  var lo = Math.min(s.rankLo||rank, rank), hi = Math.max(s.rankHi||rank, rank);
  var range = (lo===hi) ? 'firmly #'+rank : 'likely #'+lo+'&ndash;'+hi;
  return '<div class="rank-row">'+
    '<div class="rank-num">'+rank+'</div>'+
    '<div class="rank-info"><div class="rank-title">'+escapeHtml(s.title)+'</div>'+
    '<div class="rank-artist">'+escapeHtml(s.artist)+'</div></div>'+
    '<div class="rank-side">'+
      '<span class="genre-tag small">'+escapeHtml(s.genre)+'</span>'+
      '<div class="rank-rating '+(firm?'':'prov')+'">'+s.rating+'</div>'+
      '<div class="rank-n">'+plural(s.n||0,'vote')+' &middot; '+range+(set?' &middot; set':'')+'</div>'+
    '</div></div>';
}
function renderFilePreview(){
  var total=0;
  importFiles.forEach(function(f){ total+=f.rows.length; });
  return importFiles.map(function(f,idx){
    return '<div class="preview-item">'+
      '<input type="text" id="importGenre'+idx+'" aria-label="Pool name" value="'+escapeHtml(f.genre)+'" oninput="setImportGenre('+idx+',this.value)">'+
      '<span class="preview-count">'+plural(f.rows.length,'track')+'</span>'+
      '<button class="skip-btn" onclick="removeImportFile('+idx+')">Remove</button></div>';
  }).join('')+'<button class="btn block" onclick="confirmFileImport()">Import '+plural(total,'track')+'</button>';
}
function importScreen(){
  return warnHtml()+
    '<div class="import-section"><h2>Upload playlist files</h2>'+
      '<p class="import-hint">Export playlists as CSV from exportify.net, then choose the files here. Each file becomes its own pool, named after the filename &mdash; edit before importing.</p>'+
      '<div class="drop-zone" role="button" tabindex="0" ondragover="event.preventDefault(); this.classList.add(\'drag\')" ondragleave="this.classList.remove(\'drag\')" ondrop="handleDrop(event)" onclick="document.getElementById(\'fileInput\').click()" onkeydown="if(event.key===\'Enter\'){document.getElementById(\'fileInput\').click();}">Tap to choose CSV files</div>'+
      '<input type="file" id="fileInput" accept=".csv,.tsv,.txt,text/csv,text/plain" multiple style="display:none" onchange="handleFiles(this.files); this.value=\'\';">'+
      (importFiles.length?renderFilePreview():'')+
    '</div>'+
    '<div class="import-section"><h2>Or paste a list</h2>'+
      '<p class="import-hint">One song per line, formatted as Title - Artist. Every line in this batch joins the pool you name below.</p>'+
      '<input type="text" id="pasteGenre" placeholder="Pool name (e.g. Prog Rock)" value="'+escapeHtml(pasteGenre)+'" oninput="pasteGenre=this.value" style="margin-bottom:10px;">'+
      '<textarea id="pasteArea" oninput="pasteText=this.value" placeholder="Echoes - Pink Floyd&#10;Xanadu - Rush">'+escapeHtml(pasteText)+'</textarea>'+
      '<button class="btn block" onclick="handlePaste()">Add pasted songs</button>'+
    '</div>'+
    '<div class="import-section"><h2>Backup &amp; restore</h2>'+
      '<p class="import-hint">Your data lives on this device only. The backup includes every comparison you have made, so a restore reproduces the exact same ranking.</p>'+
      '<button class="btn ghost block" onclick="exportBackup()">Export backup (JSON)</button>'+
      '<button class="btn ghost block" onclick="document.getElementById(\'restoreInput\').click()">Restore from backup</button>'+
      '<input type="file" id="restoreInput" accept=".json,application/json" style="display:none" onchange="handleRestore(this.files); this.value=\'\';">'+
      (songs.length?'<button class="btn ghost block" onclick="confirmClearComparisons()">Erase all comparisons (keep songs)</button>':'')+
      (songs.length?'<button class="btn danger block" onclick="confirmReset()">Erase all song data</button>':'')+
    '</div>';
}
function statsScreen(){
  ensureRatings(true);
  if(!songs.length) return emptyState('No stats yet','Import songs and start comparing to see your collection take shape.',true);
  var genres=allGenres();
  var counts=genres.map(function(g){
    var inG=songs.filter(function(s){ return s.genre===g; });
    var c=0; inG.forEach(function(s){ c+=(s.n||0); });
    return { g:g, n:inG.length, avg:(inG.length?(c/inG.length):0), conf:rankingConfidenceFresh(inG) };
  }).sort(function(a,b){ return b.n-a.n; });
  var maxCount=counts[0].n;
  var groups=poolGroups(genres);
  var setCount=songs.length-openCount(songs);
  var linkNote='';
  if(groups.length>1){
    var listing=groups.map(function(gr){ return gr.map(escapeHtml).join(' + '); }).join('</strong> &nbsp;|&nbsp; <strong>');
    linkNote='<div class="info-banner">Your pools form <strong>'+groups.length+' separate groups</strong> that have never been compared with each other: <strong>'+listing+'</strong>.<br><br>'+
      'Songs are ranked correctly inside each group, but nothing yet places one group above another, so the combined list is not meaningful across them. &ldquo;Any pairing&rdquo; and &ldquo;Across pools&rdquo; will steer matchups toward joining them up.</div>';
  } else if(genres.length>1){
    linkNote='<div class="info-banner">All pools are linked, so the overall ranking is on one scale.</div>';
  }
  return warnHtml()+
    '<div class="stat-grid">'+
      '<div class="stat-box"><div class="stat-num">'+songs.length+'</div><div class="stat-label">songs catalogued</div></div>'+
      '<div class="stat-box"><div class="stat-num">'+totalComparisons()+'</div><div class="stat-label">comparisons recorded</div></div>'+
      '<div class="stat-box"><div class="stat-num">'+Math.round(rankingConfidence(songs).pct)+'%</div><div class="stat-label">overall ranking settled</div></div>'+
      '<div class="stat-box"><div class="stat-num">'+setCount+'</div><div class="stat-label">songs set (of '+songs.length+')</div></div>'+
    '</div>'+
    linkNote+
    dataBlock()+
    consistencyBlock()+
    coverageBlock()+
    '<h2 class="stats-heading">Pools</h2>'+
    counts.map(function(c){
      return '<div class="genre-bar-row"><div class="genre-bar-label"><span>'+escapeHtml(c.g)+'</span><span>'+c.n+' songs &middot; '+c.avg.toFixed(1)+' votes each &middot; '+Math.round(c.conf.pct)+'% settled</span></div>'+
        '<div class="genre-bar-track"><div class="genre-bar-fill" style="width:'+(c.n/maxCount*100).toFixed(0)+'%"></div></div></div>';
    }).join('')+
    '<button class="btn ghost block" onclick="exportCSV()">Export rankings as CSV</button>';
}
function consistencyBlock(){
  var c = consistency();
  if(!c || c.total < 10) return '';
  var actual = Math.round(c.agree*100), expected = Math.round(c.expect*100);
  var gap = expected - actual;
  var read = gap <= 3 ? 'Your picks are about as consistent as the matchups allow.'
    : (gap <= 8 ? 'A normal amount of back-and-forth for close calls.'
                : 'More disagreement than the closeness of the matchups explains &mdash; some picks were probably mis-taps or changes of mind.');
  var body = '<strong>'+actual+'%</strong> of your '+plural(c.total,'pick')+' match the finished order, against <strong>'+expected+
    '%</strong> expected from how close those matchups were.<br><br>'+read+
    '<br><br>Both figures are measured against a ranking built from these same votes, so this is how much you agree with yourself, not how right the list is.';
  var list = surprises(6);
  lastSurprises = list;
  var rows = '';
  if(list.length){
    var rankMap = {};
    sortedByRating(songs).forEach(function(s,i){ rankMap[s.id]=i+1; });
    rows = '<h2 class="stats-heading">Picks worth a second look</h2>'+
      '<p class="import-hint">Each of these went against everything else you have said &mdash; usually just a close call. Judging one again replaces that vote; leaving it alone keeps it. Worth doing for a mis-tap, not for every one: re-judging whatever disagrees with the ranking would only teach it to agree with itself.</p>'+
      list.map(function(it, i){
        return '<div class="surprise-row"><div class="surprise-text">'+
          '<strong>'+escapeHtml(it.w.title)+'</strong> <span class="rk">#'+rankMap[it.w.id]+'</span> beat '+
          escapeHtml(it.l.title)+' <span class="rk">#'+rankMap[it.l.id]+'</span></div>'+
          '<button class="skip-btn" onclick="reJudge('+i+')">Judge again</button></div>';
      }).join('');
  }
  return '<h2 class="stats-heading">Consistency</h2><div class="info-banner">'+body+'</div>'+rows;
}
function rankingConfidenceFresh(pool){ var saved=confCache; confCache=null; var r=rankingConfidence(pool); confCache=saved; return r; }
function dataBlock(){
  var d = dataBreakdown();
  var body = '<strong>'+d.results.toLocaleString()+'</strong> head-to-head results'+
    (d.ties ? ' and <strong>'+d.ties.toLocaleString()+'</strong> called even' : '')+
    ', each one a stored pair of song ids — one format, however many sittings they came from.';
  if(d.legacyUnits){
    body += '<br><br><strong>'+d.legacyUnits.toLocaleString()+'</strong> carried-over '+(d.legacyUnits===1?'tally':'tallies')+' on <strong>'+
      d.legacySongs.toLocaleString()+'</strong> '+(d.legacySongs===1?'song':'songs')+': win/loss counts from a version that did not record who beat whom, plus the matches of any songs you have deleted. '+
      'They still count, as results against the middle of the scale, but they say nothing about which songs were involved &mdash; so they carry less weight than a real matchup. '+
      'Erasing all comparisons (Import tab) clears these too.';
  } else {
    body += '<br><br>No carried-over tallies: every comparison in here names both songs.';
  }
  return '<h2 class="stats-heading">Comparison data</h2><div class="info-banner">'+body+'</div>';
}
function coverageBlock(){
  var c = coverageSpread(songs);
  var P = precisionCfg();
  var left = roundsLeft(songs);
  var body = 'Least-seen song: <strong>'+c.lo+'</strong> comparisons. Most-seen: <strong>'+c.hi+'</strong>. Typical: <strong>'+c.median+'</strong>.';
  if(c.zero>0) body += '<br><strong>'+c.zero+'</strong> '+(c.zero===1?'song has':'songs have')+' not appeared yet.';
  body += '<br><br>Cross-pool comparisons: <strong>'+crossCount()+'</strong>.';
  body += '<br><br>Precision: <strong>'+P.label+'</strong>' + (P.cap===Infinity
    ? ' &mdash; nothing ever locks.'
    : ' &mdash; a song is set once its place is clear, or after '+P.cap+' comparisons.'+
      (left ? ' About <strong>'+left.toLocaleString()+'</strong> round'+(left===1?'':'s')+' to go.' : ' Everything is set.'));
  return '<h2 class="stats-heading">Progress</h2><div class="info-banner">'+body+'</div>';
}

// ================= Shell =================
function topBar(){
  var labels={compare:'Compare', library:'Library', import:'Import', stats:'Stats'};
  return '<header class="top"><h1>Longplay</h1><span class="screen-label">'+labels[screen]+'</span></header>';
}
function tabBar(){
  var tabs=[['compare','Compare'],['library','Library'],['import','Import'],['stats','Stats']];
  return '<nav class="tabs">'+tabs.map(function(t){
    return '<button class="'+(screen===t[0]?'active':'')+'" '+(screen===t[0]?'aria-current="page" ':'')+'onclick="setScreen(\''+t[0]+'\')">'+icon(t[0])+'<span>'+t[1]+'</span></button>';
  }).join('')+'</nav>';
}
function setScreen(s){
  screen=s;
  if(s!=='library'){ editMode=false; selectedIds={}; }
  if(s==='compare' && !currentPair && eligibleSongs().length>=2) currentPair=pickPair(compareMode);
  render();
  try { window.scrollTo(0,0); } catch(e){}
}
function toastHtml(){ return toastMsg?'<div class="toast" role="status">'+escapeHtml(toastMsg)+'</div>':''; }
function mainContent(){
  var inner;
  if(!loaded) inner='<div class="empty-state"><h2>Loading your library</h2></div>';
  else if(screen==='compare') inner=compareScreen();
  else if(screen==='library') inner=libraryScreen();
  else if(screen==='import') inner=importScreen();
  else inner=statsScreen();
  return '<main>'+inner+'</main>'+toastHtml()+modalHtml();
}
// Re-rendering replaces the page's HTML, so remember which field had focus (and where
// the cursor was) and put it back. Without this, a toast or a background update would
// kick you out of whatever you were typing.
function render(){
  var app = document.getElementById('app');
  var active = document.activeElement;
  var id = active && active.id;
  var ss = null, se = null;
  try { ss = active.selectionStart; se = active.selectionEnd; } catch(e){}
  app.innerHTML = topBar()+mainContent()+tabBar();
  if(id){
    var el = document.getElementById(id);
    if(el && el !== active && el.focus){
      try { el.focus({preventScroll:true}); } catch(e){ try { el.focus(); } catch(e2){} }
      if(ss!=null && el.setSelectionRange){ try{ el.setSelectionRange(ss,se); }catch(e){} }
    }
  }
}

// ================= Installable =================
function buildIcon(size){
  try {
    var c=document.createElement('canvas');
    c.width=c.height=size;
    var ctx=c.getContext('2d');
    ctx.fillStyle='#1B1720'; ctx.fillRect(0,0,size,size);
    ctx.strokeStyle='#C99A3B'; ctx.lineWidth=size*0.055;
    ctx.beginPath(); ctx.arc(size*0.38,size*0.5,size*0.235,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(size*0.62,size*0.5,size*0.235,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle='#7C8F68';
    ctx.beginPath(); ctx.arc(size*0.5,size*0.5,size*0.075,0,Math.PI*2); ctx.fill();
    return c.toDataURL('image/png');
  } catch(e){ return ''; }
}
function setupInstallable(){
  try {
    var i192=buildIcon(192), i512=buildIcon(512);
    if(!i192) return;
    document.getElementById('appIcon').href=i192;
    var manifest={ name:'Longplay', short_name:'Longplay', start_url:'.', display:'standalone',
      background_color:'#1B1720', theme_color:'#1B1720',
      icons:[{src:i192,sizes:'192x192',type:'image/png'},{src:i512,sizes:'512x512',type:'image/png'}] };
    document.getElementById('appManifest').href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(manifest));
  } catch(e){}
}

document.addEventListener('keydown', onKey);
render();
loadSongs();
setupInstallable();
</script>
